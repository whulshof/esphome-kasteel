substitutions:
  devicename: "tasmota-reflashed-_"
  friendly_name: "Tasmota reflashed 1"
  device_description: "module to reflash tasmota device with minimum space needed"
  static_ip: "xxx"
#  api_reboot_timeout: 0s
#  mqtt_reboot_timeout: 0s

esphome:
  name: ${devicename}${static_ip}

---

<<: !include boards/esp12e.yaml
<<: !include wifi/wifi_kasteel.yaml
<<: !include common/common.yaml # api, ota, logger, status_led
<<: !include common/web_server_auth.yaml
<<: !include common/text_sensors.yaml
<<: !include common/sensors.yaml # wifi_signal, uptime
<<: !include common/binary_sensors.yaml # connection status

esphome:
  name: "${devicename}"
  name_add_mac_suffix: true
  comment: "${device_description}--${ip}"

wifi:
  power_save_mode: light

captive_portal:

switch:
  - !include switches/restart.yaml
#  - !include switches/shutdown.yaml
  - platform: gpio
    name: "${friendly_name}zone_5"
    icon: "mdi:remote"
    pin: GPIO16
    id: ${friendly_name}zone_5
  - platform: gpio
    name: "${friendly_name}zone_6"
    icon: "mdi:remote"
    pin: GPIO14
    id: ${friendly_name}zone_6
  - platform: gpio
    name: "${friendly_name}zone_7"
    icon: "mdi:remote"
    pin: GPIO12
    id: ${friendly_name}zone_7
  - platform: gpio
    name: "${friendly_name}zone_8"
    icon: "mdi:remote"
    pin: GPIO13
    id: ${friendly_name}zone_8

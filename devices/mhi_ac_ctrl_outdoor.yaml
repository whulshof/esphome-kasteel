---

<<: !include boards/d1_mini.yaml
<<: !include wifi/wifi_outdoor.yaml
<<: !include common/common.yaml # api, ota, logger, status_led
<<: !include common/web_server_auth.yaml
<<: !include common/text_sensors.yaml
<<: !include common/sensors.yaml # wifi_signal, uptime
<<: !include common/binary_sensors.yaml # connection status

esphome:
  name: "${devicename}${static_ip}"
  name_add_mac_suffix: true
  comment: "${device_description} ${ip}+"
  includes:
    - MHI-AC-Ctrl-ESPHome/mhi_ac_ctrl.h
    - MHI-AC-Ctrl-ESPHome/MHI-AC-Ctrl-core.h
    - MHI-AC-Ctrl-ESPHome/MHI-AC-Ctrl-core.cpp

wifi:
  power_save_mode: light

captive_portal:

switch:
  - !include switches/restart.yaml
#  - !include switches/shutdown.yaml


#esp8266:
#  board: d1_mini
#  platformio_options:
#      # Run CPU at 160Mhz to fix mhi_ac_ctrl_core.loop error: -2
#    board_build.f_cpu: 160000000L


globals:
  - id: room_temp_api_timeout
    type: int
    restore_value: no
    initial_value: '120'

climate:
  - platform: custom
    lambda: |-
      auto mhi_ac_ctrl = new MhiAcCtrl();
      App.register_component(mhi_ac_ctrl);
      return {mhi_ac_ctrl};

    climates:
      - name: "${friendly_name}"
        id: ${devicename}

api:
  reboot_timeout: 0s
  services:
    # Call the set_api_room_temperature service from HA to override the room temperature
    # If a new value has not been received after room_temp_api_timeout seconds, it will fall back to internal sensor
    - service: set_api_room_temperature
      variables:
        value: float
      then:
        - lambda: |-
            return ((MhiAcCtrl*)id(${devicename}))->set_room_temperature(value);
    # Call the set_vanes service from HA to set the vane position
    # Needed because the ESPHome Climate class does not support this natively
    # Possible values: 1-4: static positions, 5: swing, 0: unknown
    - service: set_vanes
      variables:
        value: int
      then:
        - lambda: |-
            return ((MhiAcCtrl*)id(${devicename}))->set_vanes(value);

sensor:
  - platform: uptime
    name: ${friendly_name} Uptime
  - platform: wifi_signal
    name: ${friendly_name} WiFi Signal
    update_interval: 60s
  - platform: custom
    lambda: |-
      return ((MhiAcCtrl*)id(${devicename}))->get_sensors();

    # Sensor names in HA, you can change these if you want
    # Don't delete them or change their position in the list
    sensors:
      - name: ${friendly_name} error code
      - name: ${friendly_name} outdoor temperature
      - name: ${friendly_name} return air temperature
      - name: ${friendly_name} outdoor unit fan speed
      - name: ${friendly_name} indoor unit fan speed
      - name: ${friendly_name} current power
      - name: ${friendly_name} compressor frequency
      - name: ${friendly_name} indoor unit total run time
      - name: ${friendly_name} compressor total run time
      - name: ${friendly_name} vanes

binary_sensor:
  - platform: custom
    lambda: |-
      return ((MhiAcCtrl*)id(${devicename}))->get_binary_sensors();

    binary_sensors:
      - name: ${friendly_name} defrost

text_sensor:
  - platform: version
    name: ${friendly_name} ESPHome Version
  - platform: wifi_info
    ip_address:
      name: ${friendly_name} IP
    ssid:
      name: ${friendly_name} SSID
    bssid:
      name: ${friendly_name} BSSID
---
<<: !include wifi/wifi_kasteel.yaml
<<: !include common/common.yaml # api, ota, logger, status_led
<<: !include common/web_server_auth.yaml
<<: !include common/text_sensors.yaml
<<: !include common/sensors.yaml # wifi_signal, uptime

<<: !include common/binary_sensors.yaml # connection status

wifi:
  power_save_mode: light

captive_portal:



#  - !include switches/shutdown.yaml

esphome:
  name: $devicename$static_ip
  comment: ${device_description}
  platform: ESP8266
  board: d1_mini

output:
  - platform: esp8266_pwm
    pin: $pwm_pin
    frequency: 1000 Hz
    id: mv_pwm_out
    inverted: true

switch:
  - !include switches/restart.yaml
  - platform: gpio
    name: "mv_unit_speed_bypass"
    id: mv_unit_speed_bypass
    pin:
      number: D8
      inverted: True

light:
  - platform: monochromatic
    output: mv_pwm_out
    name: "mv_unit_speed"
    id: mv_unit_speed
    gamma_correct: 1

sensor:
  - platform: pulse_counter
    pin: D2
    name: mv_tacho
    force_update: true
    update_interval: 5s
    accuracy_decimals: 0
    internal_filter: 250us
  - platform: pulse_width
    pin: D1
    id: mv_speed_requested
    update_interval: 2s
    accuracy_decimals: 5
    internal: true
    on_value:
      then:
        - component.update: mv_remote_state

text_sensor:
  - platform: template
    id: mv_remote_state
    name: mv_remote_state
    icon: mdi:fan
    lambda: |-
      float speed = id(mv_speed_requested).state;
      if(speed <= 0.00004)
      {
        return {};
      }
      else if(speed < 0.00008)
      {
        return {"Away"};
      }
      else if(speed < 0.00010)
      {
        return {"1"};
      }
      else if(speed < 0.00038)
      {
        return {"2"};
      }
      else
      {
        return {"3"};
      }
---
packages:
  common_includes: !include common/package_include.yaml

  t1: !include
    file: ../special_packages/thermostat_slot.yaml
    condition: ${zone_count >= 1}
    vars:
      slot_id: "1"
      location: "${location1}"
      zone: "${zone_loc1}"
      blt_mac_address: "${blt_mac_address_1}"


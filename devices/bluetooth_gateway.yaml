esphome:
#  name: "${devicename}"
#  name_add_mac_suffix: true
#  comment: "${device_description}--${ip}"
  on_boot:
    priority: 200
    then:
      - delay: 5s
      - script.execute: force_sync_all

time:
  - platform: sntp
    id: my_time
    timezone: "Europe/Amsterdam"   # pas aan naar jouw tijdzone
    on_time:
      - seconds: 0
        minutes: 0
        hours: 3
        then:
          - switch.turn_on: restart_switch

mqtt:
  broker: ${mqtt_broker}
  discovery: false
  reboot_timeout: ${mqtt_reboot_timeout}
  on_connect:
    then:
      - script.execute: force_sync_all

http_request:
  timeout: 2s

esp32_ble_tracker:
  scan_parameters:
    active: false

button:
  - platform: template
    name: "force_sync_all"
    on_press:
      then:
        - script.execute: force_sync_all

script:
  - id: set_zone
    parameters:
      zone: int
      state: bool
    then:
      - lambda: |-
          ESP_LOGD("set_zone","zone=%d state=%d", zone, state);

      - if:
          condition: mqtt.connected
          then:
            - mqtt.publish:
                topic: !lambda |-
                  return std::string("therm/zone/") + to_string(zone) + "/demand";
                payload: !lambda |-
                  return state ? "1" : "0";
                retain: true
          else:
            - http_request.post:
                url: !lambda |-
                  return std::string("${http_request_url}")
                       + to_string(zone)
                       + (state ? "/turn_on" : "/turn_off");


interval:
  - interval: 5min
    then:
      - script.execute: force_sync_all

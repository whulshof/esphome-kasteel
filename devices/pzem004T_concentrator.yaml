# Drie UART bussen voor 15 PZEM's
uart:
  - id: uart_bus_1
    tx_pin:
      number: GPIO17
      inverted: false
    rx_pin:
      number: GPIO16
      inverted: false
    baud_rate: 9600
    data_bits: 8
    stop_bits: 1
    parity: NONE
#    rx_buffer_size: 512

modbus:
  id: modbus1
  uart_id: uart_bus_1
  send_wait_time: 200ms



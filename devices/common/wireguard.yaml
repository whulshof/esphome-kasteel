time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Amsterdam
    servers:
     - 0.pool.ntp.org
     - 1.pool.ntp.org
     - 2.pool.ntp.org

wireguard:
  address: ${wg_address}
  private_key: ${wg_priv_key}
  peer_endpoint: 62.45.240.213
  peer_public_key: ${wg_public_key}

  # Optional netmask (this is the default, no outgoing traffic
  # will pass through the tunnel if omitted)
  netmask: 255.255.255.255

  # Optional endpoint port (WireGuard default if omitted)
  peer_port: 51820

  # Optional pre-shared key (omit if not in use)
#  peer_preshared_key: XxYyZzWw...=

  # Optional list of ip/mask (any host is allowed if omitted)
  peer_allowed_ips: ${wg_allowed_ips}  # the /32 can be omitted for single host

  # Optional keepalive (disabled by default)
  peer_persistent_keepalive: 25s

# Example configuration entry
sensor:
  - platform: wireguard
    latest_handshake:
      name: 'WireGuard Latest Handshake'
# Example configuration entry
binary_sensor:
  - platform: wireguard
    status:
      name: 'WireGuard Status'
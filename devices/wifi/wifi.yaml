---
substitutions:
  networks:
    Kasteel:
      prefix: "10.222.15"
      gateway: "10.222.14.138"
      subnet: "255.255.254.0"
      ssid: !secret wifi_ssid_IoT_Kasteel
      password: !secret wifi_password_IoT_Kasteel
    Outdoor:
      prefix: "192.168.5"
      gateway: "192.168.5.1"
      subnet: "255.255.255.0"
      ssid: !secret wifi_ssid_IoT_Outdoor
      password: !secret wifi_password_IoT_Outdoor
    TOSC:
      prefix: "10.222.34"
      gateway: "10.222.34.1"
      subnet: "255.255.255.0"
      ssid: !secret wifi_ssid_TOSC
      password: !secret wifi_password_TOSC
  # Default: the device's fixed IP. Override it in the device file when the
  # device is reached at another address (e.g. P1 #2).
  use_address: '${networks[network]["prefix"]}.${static_ip}'

wifi:
  reboot_timeout: ${wifi_reboot_timeout}
  ap:
    password: !secret ap_password
  power_save_mode: light

  ssid: ${networks[network]["ssid"]}
  password: ${networks[network]["password"]}
#  use_address: '${wg_address if wireguard == "true" and connect_via == "wg" else networks[network]["prefix"] ~ "." ~ static_ip}'
  use_address: ${use_address}
  manual_ip:
    static_ip: '${networks[network]["prefix"]}.${static_ip}'
    gateway: '${networks[network]["gateway"]}'
    subnet: '${networks[network]["subnet"]}'
    dns1: '${networks[network]["gateway"]}'
    dns2: 8.8.8.8


#  ssid: !secret wifi_ssid_IoT_Kasteel
#  password: !secret wifi_password_IoT_Kasteel
#  reboot_timeout: 0s
#  power_save_mode: none
#  manual_ip:
#    static_ip: 10.222.15.141
#    gateway: 10.222.14.138
#    subnet: 255.255.254.0

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
    ssid:
      name: "SSID"
    bssid:
      name: "BSSID"
    mac_address:
      name: "Mac Wifi Address"

sensor:
  - !include ../sensors/wifi_signal.yaml

captive_portal:
---
packages:
  common_includes: !include common/package_include.yaml

switch:
  - platform: gpio
    name: "${friendly_name} Relay1"
    icon: "mdi:remote"
    pin: GPIO4
    id: relay1
    on_turn_on:
      - delay: 400ms
      - switch.turn_off: relay1
  - platform: gpio
    name: "${friendly_name} Relay2"
    icon: "mdi:remote"
    pin: GPIO5
    id: relay2
    on_turn_on:
      - delay: 400ms
      - switch.turn_off: relay2

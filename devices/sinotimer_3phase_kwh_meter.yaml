---
packages:
  common_includes: !include common/package_include.yaml


uart:
  id: mod_bus
  tx_pin: D7
  rx_pin: D6
  baud_rate: 9600
  data_bits: 8
  stop_bits: 1
  parity: even

modbus:
  id: modbus1

modbus_controller:
  - id: sinotimer
    ## the Modbus device addr
    address: 3
    modbus_id: modbus1
    update_interval: 20s

sensor:
  - platform: modbus_controller
    modbus_controller_id: sinotimer
    name: "$friendly_name Voltage_L1"
    id: voltage_l1
    register_type: read
    address: 0x0000
    unit_of_measurement: "V"
    accuracy_decimals: 2
    value_type: FP32
  - platform: modbus_controller
    modbus_controller_id: sinotimer
    name: "$friendly_name Voltage_L2"
    id: voltage_l2
    register_type: read
    address: 0x0002
    unit_of_measurement: "V"
    accuracy_decimals: 2
    value_type: FP32
  - platform: modbus_controller
    modbus_controller_id: sinotimer
    name: "$friendly_name Voltage_L3"
    id: voltage_l3
    register_type: read
    address: 0x0004
    unit_of_measurement: "V"
    accuracy_decimals: 2
    value_type: FP32
  - platform: modbus_controller
    modbus_controller_id: sinotimer
    name: "$friendly_name Current_L1"
    id: current_l1
    register_type: read
    address: 0x0008
    unit_of_measurement: "A"
    accuracy_decimals: 2
    value_type: FP32
  - platform: modbus_controller
    modbus_controller_id: sinotimer
    name: "$friendly_name Current_L2"
    id: current_l2
    register_type: read
    address: 0x000A
    unit_of_measurement: "A"
    accuracy_decimals: 2
    value_type: FP32
  - platform: modbus_controller
    modbus_controller_id: sinotimer
    name: "$friendly_name Current_L3"
    id: current_l3
    register_type: read
    address: 0x000C
    unit_of_measurement: "A"
    accuracy_decimals: 2
    value_type: FP32
  - platform: modbus_controller
    modbus_controller_id: sinotimer
    name: "$friendly_name Active_Power_L1"
    id: active_power_l1
    register_type: read
    address: 0x0012
    unit_of_measurement: "kW"
    accuracy_decimals: 3
    value_type: FP32
  - platform: modbus_controller
    modbus_controller_id: sinotimer
    name: "$friendly_name Active_Power_L2"
    id: active_power_l2
    register_type: read
    address: 0x0014
    unit_of_measurement: "kW"
    accuracy_decimals: 3
    value_type: FP32
  - platform: modbus_controller
    modbus_controller_id: sinotimer
    name: "$friendly_name Active_Power_L3"
    id: active_power_l3
    register_type: read
    address: 0x0016
    unit_of_measurement: "kW"
    accuracy_decimals: 3
    value_type: FP32
  - platform: modbus_controller
    modbus_controller_id: sinotimer
    name: "$friendly_name Total_Active_Power"
    id: total_active_power
    register_type: read
    address: 0x0010
    unit_of_measurement: "kW"
    accuracy_decimals: 3
    value_type: FP32
  - platform: modbus_controller
    modbus_controller_id: sinotimer
    name: "$friendly_name Frequency"
    id: frequency
    register_type: read
    address: 0x0036
    unit_of_measurement: "Hz"
    accuracy_decimals: 3
    value_type: FP32
  - platform: modbus_controller
    modbus_controller_id: sinotimer
    name: "$friendly_name Total_Active_Energy"
    id: total_active_energy
    register_type: read
    address: 0x0100
    unit_of_measurement: "kWh"
    accuracy_decimals: 2
    value_type: FP32

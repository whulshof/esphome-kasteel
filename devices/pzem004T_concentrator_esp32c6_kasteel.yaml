---
<<: !include boards/esp32c6.yaml
<<: !include wifi/wifi_kasteel.yaml
<<: !include common/common.yaml # api, ota, logger, status_led
<<: !include common/web_server_auth.yaml
<<: !include common/text_sensors.yaml
<<: !include common/sensors.yaml # wifi_signal, uptime
<<: !include common/binary_sensors.yaml # connection status

esphome:
  name: "${devicename}-${static_ip}"
  name_add_mac_suffix: true
  comment: "${device_description} ${ip}"


captive_portal:

# Drie UART bussen voor 15 PZEM's
uart:
  - id: uart_bus_1
    tx_pin: D6      # GPIO6 → RX PZEM's (adres 1-5)
    rx_pin: D7      # GPIO7 met 1kΩ weerstand! ← TX PZEM's
    baud_rate: 9600
    data_bits: 8
    stop_bits: 1
    parity: NONE
    rx_buffer_size: 512
#  - id: uart_bus_2
#    tx_pin: D0      # GPIO0 → RX PZEM's (adres 6-10)
#    rx_pin: D1      # GPIO1 met 1kΩ weerstand! ← TX PZEM's
#    baud_rate: 9600
#    data_bits: 8
#    stop_bits: 1
#    parity: NONE
#
#  - id: uart_bus_3
#    tx_pin: D4      # GPIO4 → RX PZEM's (adres 11-15)
#    rx_pin: D5      # GPIO5 met 1kΩ weerstand! ← TX PZEM's
#    baud_rate: 9600
#    data_bits: 8
#    stop_bits: 1
#    parity: NONE

# Modbus configuratie voor elke bus
modbus:
  id: modbus1
  uart_id: uart_bus_1




#  - id: modbus2
#    uart_id: uart_bus_2
#    flow_control_pin: null
#
#  - id: modbus3
#    uart_id: uart_bus_3
#    flow_control_pin: null

# Sensors
sensor:
  # Bus 1 - Groep 1 t/m 5 (adres 1-5)
  - platform: pzemac
    modbus_id: modbus1
    address: ${modbus_address}
    current:
      name: "Groep 1 Stroom"
      id: groep_1_stroom
      unit_of_measurement: A
      accuracy_decimals: 2
    voltage:
      name: "Groep 1 Spanning"
      id: groep_1_spanning
      unit_of_measurement: V
      accuracy_decimals: 1
    power:
      name: "Groep 1 Vermogen"
      id: groep_1_vermogen
      unit_of_measurement: W
      accuracy_decimals: 0
    energy:
      name: "Groep 1 Energie"
      id: groep_1_energie
      unit_of_measurement: kWh
      accuracy_decimals: 2
    update_interval: 20s

  # Herhaal voor adres 2, 3, 4, 5...

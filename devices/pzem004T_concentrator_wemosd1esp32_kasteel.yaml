---
<<: !include boards/wemos_d1_mini32.yaml
<<: !include wifi/wifi_kasteel.yaml
<<: !include common/common.yaml # api, ota, logger, status_led
<<: !include common/web_server_auth.yaml
<<: !include common/text_sensors.yaml
<<: !include common/sensors.yaml # wifi_signal, uptime
<<: !include common/binary_sensors.yaml # connection status

esphome:
  name: "${devicename}-${static_ip}"
  name_add_mac_suffix: true
  comment: "${device_description} ${ip}"


captive_portal:

# Drie UART bussen voor 15 PZEM's
uart:
  - id: uart_bus_1
    tx_pin:
      number: GPIO17
      inverted: false
    rx_pin:
      number: GPIO16
      inverted: false
    baud_rate: 9600
    data_bits: 8
    stop_bits: 1
    parity: NONE
    rx_buffer_size: 512

logger:
  baud_rate: 0
  level: DEBUG

modbus:
  id: modbus1
  uart_id: uart_bus_1
  send_wait_time: 200ms


# Sensors
sensor:
  - platform: pzemac
    modbus_id: modbus1
    address: ${modbus_address1}
    current:
      name: "Groep ${groep1} Stroom"
      id: groep_${modbus_address1}_stroom
      unit_of_measurement: A
      accuracy_decimals: 2
    voltage:
      name: "Groep ${groep1} Spanning"
      id: groep_${modbus_address1}_spanning
      unit_of_measurement: V
      accuracy_decimals: 1
    power:
      name: "Groep ${groep1} Vermogen"
      id: groep_${modbus_address1}_vermogen
      unit_of_measurement: W
      accuracy_decimals: 0
    energy:
      name: "Groep ${groep1} Energie"
      id: groep_${modbus_address1}_energie
      unit_of_measurement: kWh
      accuracy_decimals: 2
    update_interval: 10                                           s


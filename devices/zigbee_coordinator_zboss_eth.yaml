---
# Zigbee coordinator (zigbee_coordinator_zboss.yaml) on Ethernet: Seeed XIAO
# ESP32-C6 + W5500 over SPI. The radio stays Zigbee-only (no WiFi), the IP
# comes from devices/network (connection_type ethernet).
#
# XIAO header (pin D-number = GPIO):
#   D8  GPIO19 SCK    D9 GPIO20 MISO   D10 GPIO18 MOSI
#   D3  GPIO21 CS     D2 GPIO2  INT    D1  GPIO1  RST
# D4/D5 (GPIO22/23) stay free for the optional NCP UART.
# Power: W5500 from the XIAO's 3V3 (its 5V pin open), or 5V to both 5V pins.

substitutions:
  connection_type: ethernet

packages:
  zboss: !include zigbee_coordinator_zboss.yaml

ethernet:
  type: W5500
  clk_pin: GPIO19
  miso_pin: GPIO20
  mosi_pin: GPIO18
  cs_pin: GPIO21
  interrupt_pin: GPIO2
  reset_pin: GPIO1

<<: !include common/web_server_auth.yaml
<<: !include common/text_sensors.yaml
<<: !include common/binary_sensors.yaml # connection status

# 1. Ethernet configuratie voor de W5500 ...
ethernet:
  type: W5500
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19
  cs_pin: GPIO5
  reset_pin: GPIO13
  interrupt_pin: GPIO4
  use_address: 10.222.14.13

# 2. Seriële poort voor de Modbus (Hardware UART2)
uart:
  id: modbus_bus
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 9600
  stop_bits: 1

# 3. De Modbus Controller
modbus:
  id: yunt_ems

modbus_controller:
  - id: battery
    address: 1 # Dit is het adres op je DTS6619 meter (vaak 001)
    modbus_id: yunt_ems
    setup_priority: -10


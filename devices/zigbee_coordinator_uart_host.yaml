---
# Olimex ESP32-PoE (LAN8720) as the UART host of a Zigbee coordinator without
# a network (an ESP32-C6, zigbee_coordinator_zboss_uart.yaml, on the UEXT):
# it passes the NCP's UART on to TCP port 6638 (stream_server), updates the
# C6 ("Update C6", c6_flasher) and shows the C6's sensors (status line).
#   Zigbee2MQTT:  serial: { port: "tcp://<ip>:6638", adapter: zboss }
#
# The device file sets, besides the usual devicename/friendly_name/...:
#   network, static_ip    the fixed IP (devices/network, connection_type ethernet)
#   c6_firmware_url       where "Update C6" fetches the C6's factory image
#                         (tools/publish_c6_firmware.sh <C6 device file>)

substitutions:
  connection_type: ethernet

packages:
  common_includes: !include common/package_include.yaml
  z2m_lookup: !include zigbee_z2m_lookup.yaml   # "Zigbee host" names the z2m

esphome:
  includes:
    - devices/include/stream_server_client.h

external_components:
  - source: github://tube0013/esphome-components
    components: [stream_server]
  - source:
      type: local
      path: ../external_components/my_components
    components: [c6_flasher]

ethernet:
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk:
    pin: GPIO17
    mode: CLK_OUT
  phy_addr: 0
  power_pin:
    number: GPIO12
    ignore_strapping_warning: true
  # The IP comes from devices/network/ethernet_ip.yaml (network, static_ip).

# UART on the UEXT connector (C6: zigbee_coordinator_zboss_uart.yaml)
#   UEXT 3  GPIO4   TX            -> C6 GPIO17 (XIAO D7)
#   UEXT 4  GPIO36  RX            <- C6 GPIO16 (XIAO D6)
#   UEXT 5  GPIO16  download line -> C6 GPIO2  (XIAO D2)
#   UEXT 6  GPIO13  status line   <- C6 GPIO22 (XIAO D4)
#   UEXT 1/2 3.3 V / GND
uart:
  - id: zigbee_uart
    tx_pin: GPIO4
    rx_pin: GPIO36
    baud_rate: 115200
    rx_buffer_size: 1024
  # The C6's status line (see the sensors at the end of this file).
  - id: c6_status_uart
    rx_pin: GPIO13
    baud_rate: 9600
    debug:
      direction: RX
      dummy_receiver: true
      after:
        delimiter: "\n"
      sequence:
        - lambda: |-
            std::string line(bytes.begin(), bytes.end());
            if (line.rfind("ZB;", 0) != 0)
              return;
            size_t pos = 3;
            while (pos < line.size()) {
              size_t end = line.find(';', pos);
              if (end == std::string::npos)
                end = line.size();
              std::string item = line.substr(pos, end - pos);
              pos = end + 1;
              size_t eq = item.find('=');
              if (eq == std::string::npos)
                continue;
              std::string key = item.substr(0, eq);
              std::string value = item.substr(eq + 1);
              while (!value.empty() && (value.back() == '\n' || value.back() == '\r'))
                value.pop_back();
              if (key == "rssi") {
                id(c6_zb_rssi).publish_state(strtof(value.c_str(), nullptr));
              } else if (key == "rssi_min") {
                id(c6_zb_rssi_min).publish_state(strtof(value.c_str(), nullptr));
              } else if (key == "lqi") {
                id(c6_zb_lqi).publish_state(strtof(value.c_str(), nullptr));
              } else if (key == "frames") {
                id(c6_zb_frames).publish_state(strtof(value.c_str(), nullptr));
              } else if (key == "channel") {
                id(c6_zb_channel).publish_state(strtof(value.c_str(), nullptr));
              } else if (key == "pan") {
                id(c6_zb_pan).publish_state(value);
              } else if (key == "fw") {
                id(c6_firmware).publish_state(value);
              } else if (key == "lost") {
                id(c6_zb_lost).publish_state(value == "1");
              }
            }



stream_server:
  id: zigbee_bridge
  uart_id: zigbee_uart
  port: 6638

# Update the C6 from here, without USB (external_components/my_components/
# c6_flasher, Espressif's esp-serial-flasher): "Update C6" downloads the
# factory image from c6_firmware_url, pulls the download line low (open
# drain; the C6 reboots into its ROM download mode), writes and verifies the
# image over the UART and resets the C6 with its watchdog. The bridge on port
# 6638 pauses meanwhile; Zigbee2MQTT reconnects by itself. About 1.5 minutes.
# Publish a build with tools/publish_c6_firmware.sh.
# "C6 download mode" only pulls the line, to flash from a PC through port
# 6638 with tools/flash_c6_over_uart.py.
c6_flasher:
  id: c6_update
  uart_id: zigbee_uart
  stream_server_id: zigbee_bridge
  url: ${c6_firmware_url}
  download_pin:
    number: GPIO16
    mode:
      output: true
      open_drain: true
    inverted: true
  status:
    name: "C6 update"

button:
  - platform: template
    name: "Update C6"
    icon: mdi:chip
    entity_category: config
    on_press:
      - c6_flasher.update: c6_update
  - platform: template
    name: "C6 download mode"
    icon: mdi:download
    entity_category: config
    on_press:
      - c6_flasher.download_mode: c6_update

# The C6's sensors: it has no network, so it sends them once a minute as a
# line of text on a second UART (see zigbee_coordinator_zboss_uart.yaml):
#   ZB;rssi=-63;rssi_min=-64;lqi=87;frames=8;channel=15;pan=0x1A2B;lost=0;fw=1.5.0.81
# The signal values are unknown ("nan") in a minute without frames, and all
# of them after 3 minutes without a line.

sensor:
  - platform: template
    id: c6_zb_rssi
    name: Zigbee RSSI
    unit_of_measurement: dBm
    device_class: signal_strength
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 0
    filters:
      - timeout: 3min
  - platform: template
    id: c6_zb_rssi_min
    name: Zigbee RSSI weakest
    unit_of_measurement: dBm
    device_class: signal_strength
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 0
    filters:
      - timeout: 3min
  - platform: template
    id: c6_zb_lqi
    name: Zigbee LQI
    icon: mdi:signal
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 0
    filters:
      - timeout: 3min
  - platform: template
    id: c6_zb_frames
    name: Zigbee frames received
    icon: mdi:message-arrow-left
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 0
    filters:
      - timeout: 3min
  - platform: template
    id: c6_zb_channel
    name: Zigbee channel
    icon: mdi:zigbee
    entity_category: diagnostic
    accuracy_decimals: 0
    filters:
      - timeout: 3min

text_sensor:
  # Who is on port 6638 (here, not on the C6: the C6 only sees serial bytes):
  # the base_topic of the z2m whose bridge/info names this bridge, else the
  # peer's IP (with Docker: the Docker host's).
  - platform: template
    id: zb_host
    name: "Zigbee host"
    icon: mdi:lan-connect
    entity_category: diagnostic
    update_interval: 5s
    lambda: |-
      std::string s = stream_server_client(id(zigbee_bridge));
      if (s.empty())
        s = "none";
      else {
        std::string z2m = z2m_for_bridge();
        if (!z2m.empty())
          s = z2m;
      }
      if (id(zb_host).has_state() && id(zb_host).state == s)
        return {};
      return s;
  - platform: template
    id: c6_zb_pan
    name: Zigbee PAN ID
    icon: mdi:zigbee
    entity_category: diagnostic
  - platform: template
    id: c6_firmware
    name: C6 NCP firmware
    icon: mdi:chip
    entity_category: diagnostic

binary_sensor:
  - platform: stream_server
    stream_server: zigbee_bridge
    connected:
      name: "Zigbee host connected"
  - platform: template
    id: c6_zb_lost
    name: Zigbee network lost
    device_class: problem
    entity_category: diagnostic

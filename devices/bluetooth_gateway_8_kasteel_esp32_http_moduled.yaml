---

<<: !include boards/wemos_d1_mini32.yaml
<<: !include wifi/wifi_kasteel.yaml
<<: !include common/common.yaml # api, ota, logger, status_led
<<: !include common/web_server_auth.yaml
<<: !include common/text_sensors.yaml
<<: !include common/sensors.yaml # wifi_signal, uptime
<<: !include common/binary_sensors.yaml # connection status

esphome:
  name: "${devicename}"
  name_add_mac_suffix: true
  comment: "${device_description}--${ip}"
  on_boot:
    priority: 200
    then:
      - delay: 5s
      - script.execute: force_sync_all

captive_portal:

time:
  - platform: homeassistant

mqtt:
  broker: ${mqtt_broker}
  discovery: false
  reboot_timeout: ${mqtt_reboot_timeout}
  on_connect:
    then:
      - script.execute: force_sync_all

http_request:
  timeout: 2s

esp32_ble_tracker:


switch:
  - platform: restart
    name: ${friendly_name}-restart
    id: restart_switch

button:
  - platform: template
    name: "force_sync_all"
    on_press:
      then:
        - script.execute: force_sync_all

packages:
  t1: !include
    file: thermostat_slot.yaml
    vars:
      slot_id: "1"
      location: "${location1}"
      zone: "${zone_loc1}"
      blt_mac_address: "${blt_mac_address_1}"

  t2: !include
    file: thermostat_slot.yaml
    vars:
      slot_id: "2"
      location: "${location2}"
      zone: "${zone_loc2}"
      blt_mac_address: "${blt_mac_address_2}"

  t3: !include
    file: thermostat_slot.yaml
    vars:
      slot_id: "3"
      location: "${location3}"
      zone: "${zone_loc3}"
      blt_mac_address: "${blt_mac_address_3}"

  t4: !include
    file: thermostat_slot.yaml
    vars:
      slot_id: "4"
      location: "${location4}"
      zone: "${zone_loc4}"
      blt_mac_address: "${blt_mac_address_4}"

  t5: !include
    file: thermostat_slot.yaml
    vars:
      slot_id: "5"
      location: "${location5}"
      zone: "${zone_loc5}"
      blt_mac_address: "${blt_mac_address_5}"

  t6: !include
    file: thermostat_slot.yaml
    vars:
      slot_id: "6"
      location: "${location6}"
      zone: "${zone_loc6}"
      blt_mac_address: "${blt_mac_address_6}"

  t7: !include
    file: thermostat_slot.yaml
    vars:
      slot_id: "7"
      location: "${location7}"
      zone: "${zone_loc7}"
      blt_mac_address: "${blt_mac_address_7}"

#  t8: !include
#    file: thermostat_slot.yaml
#    vars:
#      slot_id: "8"
#      location: "${location8}"
#      zone: "${zone_loc8}"
#      blt_mac_address: "${blt_mac_address_8}"
#
sensor:
  - platform: atc_mithermometer
    mac_address: "${blt_mac_address_8}"
    humidity:
      name: "Humidity ${location8}"
      id: hum_8
    battery_level:
      name: "Battery Level ${location8}"
      id: bat_8
      device_class: battery

# omdat de BLE thermometer te ver weg is, gebruiken we een zigbee temp sensor. Via HA
  - platform: homeassistant
    id: temp_8
    entity_id: sensor.z4_temp_meter_temperature
    name: "Temperature ${location8}"
#    update_interval: 30s

climate:
  - platform: thermostat
    name: "thermostaat ${location8}"
    id: thermostat_8
    sensor: temp_8
    on_boot_restore_from: memory
    preset:
      - name: Home
        default_target_temperature_low: 20.0
    heat_deadband: ${heat_deadband} °C
    heat_overrun: ${heat_overrun} °C
    min_heating_run_time: ${min_heating_run_time}
    min_heating_off_time: ${min_heating_off_time}
    min_idle_time: ${min_idle_time}

    heat_action:
      - script.execute:
          id: set_zone
          zone: 16
          state: true

    idle_action:
      - script.execute:
          id: set_zone
          zone: 16
          state: false

script:
  - id: sync_slot_8
    then:
      - lambda: |-
          ESP_LOGD("force_sync", "t1 mode=%d action=%d",
                   (int) id(thermostat_8).mode,
                   (int) id(thermostat_8).action);
      - script.execute:
          id: set_zone
          zone: 16
          state: !lambda 'return id(thermostat_8).action == climate::CLIMATE_ACTION_HEATING;'

  - id: set_zone
    parameters:
      zone: int
      state: bool
    then:
      - lambda: |-
          ESP_LOGD("set_zone","zone=%d state=%d", zone, state);

      - if:
          condition: mqtt.connected
          then:
            - mqtt.publish:
                topic: !lambda |-
                  return std::string("therm/zone/") + to_string(zone) + "/demand";
                payload: !lambda |-
                  return state ? "1" : "0";
                retain: true
          else:
            - http_request.post:
                url: !lambda |-
                  return std::string("${http_request_url}")
                       + to_string(zone)
                       + (state ? "/turn_on" : "/turn_off");

  - id: force_sync_all
    then:
      - script.execute: sync_slot_1
      - script.execute: sync_slot_2
      - script.execute: sync_slot_3
      - script.execute: sync_slot_4
      - script.execute: sync_slot_5
      - script.execute: sync_slot_6
      - script.execute: sync_slot_7
      - script.execute: sync_slot_8


interval:
  - interval: 5min
    then:
      - script.execute: force_sync_all

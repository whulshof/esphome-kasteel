---

<<: !include boards/nodemcu32s.yaml
<<: !include wifi/wifi_kasteel.yaml
<<: !include common/common.yaml # api, ota, logger, status_led
<<: !include common/web_server_auth.yaml
<<: !include common/text_sensors.yaml
<<: !include common/sensors.yaml # wifi_signal, uptime
<<: !include common/binary_sensors.yaml # connection status

esphome:
  name: ${devicename}
  name_add_mac_suffix: true
  comment: "${device_description}--${ip}"
  on_boot:
    priority: 200
    then:
      - delay: 5s
      - script.execute: force_sync_all

captive_portal:

time:
  - platform: homeassistant

mqtt:
  broker: ${mqtt_broker}
  discovery: false
  reboot_timeout: ${mqtt_reboot_timeout}
  on_connect:
    then:
      - script.execute: force_sync_all

http_request:
  timeout: 2s

esp32_ble_tracker:


switch:
  - platform: restart
    name: ${friendly_name}-restart
    id: restart_switch

button:
  - platform: template
    name: "force_sync_all"
    on_press:
      then:
        - script.execute: force_sync_all

packages:
  t1: !include
    file: thermostat_slot.yaml
    vars:
      slot_id: "1"
      location: "${location1}"
      zone: "${zone_loc1}"
      blt_mac_address: "${blt_mac_address_1}"

  t2: !include
    file: thermostat_slot.yaml
    vars:
      slot_id: "2"
      location: "${location2}"
      zone: "${zone_loc2}"
      blt_mac_address: "${blt_mac_address_2}"

  t3: !include
    file: thermostat_slot.yaml
    vars:
      slot_id: "3"
      location: "${location3}"
      zone: "${zone_loc3}"
      blt_mac_address: "${blt_mac_address_3}"

  t4: !include
    file: thermostat_slot.yaml
    vars:
      slot_id: "4"
      location: "${location4}"
      zone: "${zone_loc4}"
      blt_mac_address: "${blt_mac_address_4}"

script:
  - id: set_zone
    parameters:
      zone: int
      state: bool
    then:
      - lambda: |-
          ESP_LOGD("set_zone","zone=%d state=%d", zone, state);

      - if:
          condition: mqtt.connected
          then:
            - mqtt.publish:
                topic: !lambda |-
                  return std::string("therm/zone/") + to_string(zone) + "/demand";
                payload: !lambda |-
                  return state ? "1" : "0";
                retain: true
          else:
            - http_request.post:
                url: !lambda |-
                  return std::string("${http_request_url}")
                       + to_string(zone)
                       + (state ? "/turn_on" : "/turn_off");

  - id: force_sync_all
    then:
      - script.execute: sync_slot_1
      - script.execute: sync_slot_2
      - script.execute: sync_slot_3
      - script.execute: sync_slot_4


interval:
  - interval: 5min
    then:
      - script.execute: force_sync_all

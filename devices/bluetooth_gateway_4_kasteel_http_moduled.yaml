---

packages:
  common_includes: !include package_include.yaml

  t1: !include
    file: thermostat_slot.yaml
    condition: ${number_of_slots >= 1}
    vars:
      slot_id: "1"
      location: "${location1}"
      zone: "${zone_loc1}"
      blt_mac_address: "${blt_mac_address_1}"

  t2: !include
    file: thermostat_slot.yaml
    condition: ${number_of_slots >= 2}
    vars:
      slot_id: "2"
      location: "${location2}"
      zone: "${zone_loc2}"
      blt_mac_address: "${blt_mac_address_2}"

  t3: !include
    file: thermostat_slot.yaml
    condition: ${number_of_slots >= 3}
    vars:
      slot_id: "3"
      location: "${location3}"
      zone: "${zone_loc3}"
      blt_mac_address: "${blt_mac_address_3}"

  t4: !include
    file: thermostat_slot.yaml
    condition: ${number_of_slots >= 4}
    vars:
      slot_id: "4"
      location: "${location4}"
      zone: "${zone_loc4}"
      blt_mac_address: "${blt_mac_address_4}"

esphome:
#  name: ${devicename}
#  name_add_mac_suffix: true
#  comment: "${device_description}--${ip}"
  on_boot:
    priority: 200
    then:
      - delay: 5s
      - script.execute: force_sync_all


time:
  - platform: sntp
    id: my_time
    timezone: "Europe/Amsterdam"   # pas aan naar jouw tijdzone
    on_time:
      - seconds: 0
        minutes: 0
        hours: 3
        then:
          - switch.turn_on: restart_switch

mqtt:
  broker: ${mqtt_broker}
  discovery: false
  reboot_timeout: ${mqtt_reboot_timeout}
  on_connect:
    then:
      - script.execute: force_sync_all

http_request:
  timeout: 2s

esp32_ble_tracker:
  scan_parameters:
    active: false



button:
  - platform: template
    name: "force_sync_all"
    on_press:
      then:
        - script.execute: force_sync_all

script:
  - id: set_zone
    parameters:
      zone: int
      state: bool
    then:
      - lambda: |-
          ESP_LOGD("set_zone","zone=%d state=%d", zone, state);

      - if:
          condition: mqtt.connected
          then:
            - mqtt.publish:
                topic: !lambda |-
                  return std::string("therm/zone/") + to_string(zone) + "/demand";
                payload: !lambda |-
                  return state ? "1" : "0";
                retain: true
          else:
            - http_request.post:
                url: !lambda |-
                  return std::string("${http_request_url}")
                       + to_string(zone)
                       + (state ? "/turn_on" : "/turn_off");

  - id: force_sync_all
    then:
      - script.execute: sync_slot_1
      - script.execute: sync_slot_2
      - script.execute: sync_slot_3
      - script.execute: sync_slot_4


interval:
  - interval: 5min
    then:
      - script.execute: force_sync_all

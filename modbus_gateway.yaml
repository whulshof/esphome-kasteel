esphome:
  name: battery-gw
  friendly_name: Battery GW

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:
  reboot_timeout: 0s

ota:
  - platform: esphome

ethernet:
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk:
    pin: GPIO0
    mode: CLK_OUT
  phy_addr: 0
  power_pin: GPIO12
  manual_ip:
    static_ip: 10.222.15.202
    gateway: 10.222.14.138
    subnet: 255.255.254.0
    dns1: 10.222.14.138
    dns2: 8.8.8.8

uart:
  id: rtu_uart
  tx_pin: GPIO32
  rx_pin: GPIO33
  baud_rate: 9600
  parity: NONE
  stop_bits: 1

external_components:
  - source:
      type: local
      path: ./external_components/my_components

modbus_tcp_rtu_gateway:
  id: gw1
  uart_id: rtu_uart
  port: 502
  response_timeout_ms: 500

binary_sensor:
  - platform: modbus_tcp_rtu_gateway
    gateway_id: gw1
    healthy:
      name: "Gateway Healthy"
    client_connected:
      name: "Gateway Client Connected"